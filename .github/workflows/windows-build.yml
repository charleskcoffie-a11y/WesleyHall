name: Wesley Hall Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Windows runner
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=SUPABASE_URL=https://hxgojapfsqsmwveaszvn.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_I-_bvBnjqyWv2dD1AzQX6A_aEavFbBS

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WesleyHall-Windows
          path: build/windows/x64/runner/Release/**
