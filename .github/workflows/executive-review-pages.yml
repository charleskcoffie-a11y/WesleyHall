name: Wesley Hall Executive Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web runner
        run: flutter create --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build connected executive review
        run: >-
          flutter build web --release
          --base-href "/WesleyHall/"
          --dart-define=SUPABASE_URL=https://hxgojapfsqsmwveaszvn.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_I-_bvBnjqyWv2dD1AzQX6A_aEavFbBS

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
